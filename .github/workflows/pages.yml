name: Testes e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências de teste
        run: npm ci
      - name: Testes de regras, interface e validador de conteúdo
        run: npm test
      - name: Conferência dos trechos Java
        run: node tools/verify-java.mjs

  python:
    name: Python 3.14 em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Instalar bibliotecas da trilha
        run: python -m pip install -r verify/python/requirements.txt
      - name: Conferir aulas, cadernos e kits
        run: python tools/python-course.py check
      - name: Executar exemplos e casos de borda
        run: python tools/python-course.py run

  publicar:
    if: github.event_name != 'pull_request'
    needs: [testes, python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Montar a pasta do site
        run: |
          mkdir _site
          cp -r index.html .nojekyll css js content _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
