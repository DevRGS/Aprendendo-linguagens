<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de estudos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main>
    <h1>Catálogo de estudos</h1>
    <section aria-labelledby="trilhas">
      <h2 id="trilhas">Trilhas</h2>
      <ul class="colecao">
        <li><article>
          <h3>Web</h3>
          <p>Crie e publique uma página navegável.</p>
          <a href="trilhas/web.html">Abrir trilha Web</a>
        </article></li>
      </ul>
    </section>
    <section aria-labelledby="contato">
      <h2 id="contato">Conferência de contato</h2>
      <p>Use um e-mail fictício. O navegador verifica o formato e abre uma confirmação. O valor não é enviado nem salvo pelo site.</p>
      <form action="obrigado.html" method="get">
        <label for="email">E-mail fictício (obrigatório)</label>
        <input id="email" type="email" required>
        <button>Conferir</button>
      </form>
    </section>
  </main>
